<!doctype html><html><head><meta charset="utf-8"><title>ATLAS 42 • Asset inspection</title><style>body{margin:0;background:#19232b;color:#eff2ed;font:14px system-ui}canvas{display:block}header{position:absolute;top:32px;left:40px;pointer-events:none}h1{font-size:32px;letter-spacing:5px;margin:0 0 8px}p{color:#b7c5cc;margin:5px 0}nav{position:absolute;bottom:28px;left:40px;display:flex;gap:8px}button{background:#273b48;color:white;border:1px solid #71828b;padding:12px 20px;cursor:pointer}#caption{position:absolute;right:40px;bottom:40px;color:#c8d5da}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script></head><body><header><h1>ATLAS / 42</h1><p>Armored VTOL transport · Standalone asset study</p><p id="measure"></p></header><nav><button onclick="setView('hero')">Front ¾</button><button onclick="setView('rear')">Rear ¾</button><button onclick="setView('scale')">Player scale</button><button onclick="setView('collision')">Collisions</button></nav><div id="caption"></div><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';
import {createAtlas42} from './Atlas42.js';
import {buildCharacter,heroSuitAppearance} from '../../../src/char/Rig.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#19232b');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;document.body.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,200);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,3,0);
scene.add(new THREE.HemisphereLight(0xd6eaff,0x777665,2.5));
for(const [pos,intensity,color] of [[[5,23,13],4,0xffe9c8],[[-18,13,-9],3,0x8ccaff]]){const l=new THREE.DirectionalLight(color,intensity);l.position.set(...pos);l.castShadow=true;l.shadow.mapSize.set(2048,2048);Object.assign(l.shadow.camera,{left:-24,right:24,top:24,bottom:-24,near:1,far:70});l.shadow.bias=-.0003;scene.add(l);}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(160,160),new THREE.MeshStandardMaterial({color:0x404d55,roughness:.95}));floor.rotation.x=-Math.PI/2;floor.position.y=-.015;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(80,40,0x657580,0x4e5c64);grid.position.y=.002;scene.add(grid);
const asset=createAtlas42();scene.add(asset.group);const debug=asset.createCollisionDebug();debug.visible=false;scene.add(debug);
const player=buildCharacter(heroSuitAppearance({primary:'#1b47c9',secondary:'#d81f3d',accent:'#ffd447',skin:'#e0ac82',build:1,height:1,emblem:true,emblemColor:'#ffd447',mask:'domino',glow:.38})).group;
player.position.set(3.9,0,7.5);scene.add(player);const pb=new THREE.Box3().setFromObject(player);player.position.y-=pb.min.y;
const b=new THREE.Box3().setFromObject(asset.group),size=b.getSize(new THREE.Vector3());document.getElementById('measure').textContent=`${size.x.toFixed(1)} m span / ${size.z.toFixed(1)} m length / ${size.y.toFixed(1)} m height`;
window.setView=(v)=>{debug.visible=v==='collision';player.visible=v==='scale';asset.group.traverse(o=>{if(o.isMesh){o.material.transparent=v==='collision';o.material.opacity=v==='collision'?.35:1;}});const views={hero:[[25,15,29],[0,3,0]],rear:[[-24,16,-29],[0,3,0]],scale:[[22,9,30],[0,3,1]],collision:[[23,18,27],[0,3,0]]};camera.position.set(...views[v][0]);controls.target.set(...views[v][1]);controls.update();document.getElementById('caption').textContent=v==='scale'?'Actual default player rig • same world scale':v==='collision'?`${asset.collisionParts.length} collision prisms • turquoise wireframe`:'Parked configuration • landing gear deployed';renderer.render(scene,camera);};
window.exportAsset=async()=>{setView('hero');return Array.from(new Uint8Array(await new GLTFExporter().parseAsync(asset.group,{binary:true})));};
window.asset=asset;window.metrics={size:size.toArray(),playerHeight:pb.max.y-pb.min.y,colliders:asset.collisionParts.length};window.setView('hero');window.ready=true;
renderer.setAnimationLoop(()=>renderer.render(scene,camera));addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
