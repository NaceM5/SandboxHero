<!doctype html><html lang="en"><meta charset="utf-8"><title>Aegis Helicarrier</title><style>body{margin:0;font:14px system-ui;color:#e2f7ff;background:#112536}header{position:absolute;top:20px;left:24px;padding:18px 22px;border:1px solid #41758b;background:#0d2230ed;border-radius:10px;z-index:1}h1{margin:0;font-size:25px}p{color:#9dc6d8}button,select{background:#193e50;color:#e2f7ff;border:1px solid #538fa4;padding:9px;border-radius:5px;cursor:pointer}canvas{display:block}</style>
<header><h1>AEGIS / airborne headquarters</h1><p>Two flight decks · 920 / 932 m · headquarters below</p><button id="outside">Exterior</button> <button id="deck">Deck lift</button> <button id="lift">Use lift (E)</button> <select id="room" aria-label="Headquarters room"><option value="">Explore headquarters</option></select><p id="status">Loading…</p></header>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {createMapData} from '../src/world/tideline/map-data.js';import {buildWorld} from '../src/world/tideline/world.js';import {useElevator,ElevatorPrompt} from '../src/world/Elevators.js';
const data=createMapData(),h=data.helicarrier;data.signs=data.signs.filter(s=>s.position[1]>850);
const built=buildWorld(data,{collision:false,water:false}),scene=new THREE.Scene();scene.background=new THREE.Color('#7997ad');scene.add(built.group);
scene.add(new THREE.HemisphereLight(0xc6e9ff,0x343e59,2.1));const sun=new THREE.DirectionalLight(0xffe6ca,3);sun.position.set(h.x-150,1200,h.z-100);scene.add(sun);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,10000),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
const status=document.querySelector('#status'),p={pos:new THREE.Vector3(),vel:new THREE.Vector3(),holder:{position:new THREE.Vector3()}},world={player:p,city:{data},cameraRig:{},notify(t){status.textContent=t;}},prompt=new ElevatorPrompt(world);
const at=(x,y,z)=>new THREE.Vector3(h.x+x,y,h.z+z);
function exterior(){camera.position.copy(at(220,1060,250));controls.target.copy(at(0,912,0));p.pos.set(0,0,0);status.textContent='Two-tier flight deck, connecting ramp, four rotating turbines and operations bridge';controls.update();prompt.update();}
function eye(){camera.position.copy(p.pos).add(new THREE.Vector3(0,1.75,0));controls.target.copy(camera.position).add(new THREE.Vector3(0,-.1,8));controls.update();prompt.update();}
document.querySelector('#outside').onclick=exterior;document.querySelector('#deck').onclick=()=>{p.pos.fromArray(h.upper);eye();status.textContent='On the flight deck · press E for headquarters';};
function lift(){if(useElevator(world)){eye();status.textContent=p.pos.y===h.floor?'Headquarters level · rear fly-in balcony ahead · press E to return':'Flight deck · press E to return to headquarters';}else status.textContent='Select Deck lift to use the elevator';}
document.querySelector('#lift').onclick=lift;addEventListener('keydown',e=>{if(e.code==='KeyE'&&!e.repeat)lift();});
const select=document.querySelector('#room');h.rooms.forEach((r,i)=>select.add(new Option(r.name,i)));select.onchange=()=>{if(select.value==='')return;const r=h.rooms[+select.value];p.pos.fromArray(r.position);if(+select.value===0){camera.position.copy(at(22,h.floor+7,-49));controls.target.copy(at(0,h.floor+2,-83));}else{camera.position.copy(p.pos).add(new THREE.Vector3(0,5,10));controls.target.copy(p.pos).add(new THREE.Vector3(+select.value%2?-10:10,1,-8));}controls.update();prompt.update();status.textContent=r.name;};
exterior();const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{built.updateHelicarrier(Math.min(clock.getDelta(),.05));controls.update();renderer.render(scene,camera);});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></html>
